[project]
state_dir = ".starfix"

[github]
login = "tiammomo"
git_name = "tiammomo"
git_email = "pearfl@qq.com"
api_url = "https://api.github.com"
token_env = ["GITHUB_TOKEN", "GH_TOKEN"]
gh_auth_command = ["gh", "auth", "token", "--hostname", "github.com"]

[discovery]
issues_per_repo = 100
max_pages = 2
competing_work_checks_per_repo = 10
min_score = 30
preferred_labels = ["good first issue", "help wanted", "bug", "documentation", "external"]
blocked_labels = [
  "security",
  "in progress",
  "inprogress",
  "duplicate",
  "invalid",
  "wontfix",
  "question",
  "needs reproduction",
  "needs confirmation",
  "server issue",
]

[safety]
max_files_changed = 18
max_diff_lines = 700
max_daily_submissions = 2
require_verification = true
draft_pull_requests = true
forbidden_paths = [".github/workflows/", ".git/", ".env", "credentials", "secrets"]

[agent]
executable = "codex"
timeout_seconds = 1800
# Leave blank to use the authenticated Codex CLI defaults.
model = ""
reasoning_effort = ""

[runner]
image = "starfix-runner:latest"
timeout_seconds = 1800
cpus = 4
memory = "8g"
pids_limit = 1024
max_output_chars = 60000

[repositories."langchain-ai/deepagents"]
enabled = true
auto_prepare = true
min_stars = 5000
preferred_labels = ["external", "bug", "deepagents"]
blocked_labels = ["quickjs", "needs-maintainer-action"]
require_assignment_before_submit = true
require_no_competing_work = true
required_contribution_files = ["AGENTS.md", "libs/DEVELOPMENT.md"]
bootstrap_commands = ["cd libs/deepagents && uv sync --all-groups"]
verification_prefixes = [
  "cd libs/deepagents && uv run --group test pytest ",
  "cd libs/deepagents && uv run --all-groups ruff check ",
  "cd libs/deepagents && uv run --all-groups ruff format ",
  "cd libs/deepagents && uv run --all-groups ty check",
]
required_verification_markers = ["pytest", "ruff check", "ruff format", "ty check"]
branch_template = "{login}/{scope}/{slug}"
default_scope = "sdk"
max_files_changed = 10
max_diff_lines = 500

[repositories."bytedance/deer-flow"]
enabled = true
# DeerFlow is discovery-only until a non-conflicting issue has been selected and
# its backend/frontend verification image is chosen explicitly.
auto_prepare = false
min_stars = 10000
preferred_labels = ["help wanted", "bug", "documentation"]
blocked_labels = [
  "security",
  "needs-triage",
  "needs-validation",
  "RFC",
  "P1",
  "risk:high",
  "duplicate",
  "AI Submitted",
]
require_no_competing_work = true
required_contribution_files = [
  "AGENTS.md",
  "CONTRIBUTING.md",
  ".github/pull_request_template.md",
]
pull_request_body_style = "deer-flow"
pull_request_template_path = ".github/pull_request_template.md"
pull_request_template_sha256 = "001208d279496a4a3475fe7df5c522555a8d6f55fd0b6627562fe0560e75259c"
bootstrap_commands = ["cd backend && uv sync --all-groups"]
verification_prefixes = [
  "cd backend && make lint",
  "cd backend && make test",
  "cd frontend && pnpm format",
  "cd frontend && pnpm lint",
  "cd frontend && pnpm typecheck",
  "cd frontend && BETTER_AUTH_SECRET=local-dev-secret pnpm build",
  "cd frontend && make test",
  "cd frontend && make test-e2e",
]
branch_template = "{login}/{scope}/{slug}"
default_scope = "deer-flow"
max_files_changed = 12
max_diff_lines = 500

[repositories."4paradigm/OpenMLDB"]
enabled = true
auto_prepare = false
min_stars = 1000
preferred_labels = ["good first issue", "help wanted", "bug", "enhancement", "batch-engine"]
require_assignment_before_submit = true
require_no_competing_work = true
required_contribution_files = ["CONTRIBUTING.md", ".github/pull_request_template.md"]
pull_request_template_path = ".github/pull_request_template.md"
pull_request_template_sha256 = "c1e4a04ddac54afdef797758351b9286b98bf0b4980175af29e9831d3cdbde57"
bootstrap_commands = [
  "mkdir -p .git/starfix-m2 .git/starfix-home .git/jansi .git/starfix-native-tmp",
  "protoc -I hybridse/src/proto --java_out=java/hybridse-proto/src/main/java hybridse/src/proto/fe_type.proto hybridse/src/proto/fe_common.proto hybridse/src/proto/dbms.proto hybridse/src/proto/fe_tablet.proto hybridse/src/proto/batch.proto hybridse/src/proto/plan.proto",
  "protoc -I src/proto --java_out=java/openmldb-common/src/main/java src/proto/type.proto src/proto/common.proto src/proto/tablet.proto src/proto/name_server.proto src/proto/sql_procedure.proto src/proto/api_server.proto src/proto/taskmanager.proto src/proto/data_sync.proto",
  "(cd java && MAVEN_OPTS='-Djansi.tmpdir=/workspace/.git/jansi -Duser.home=/workspace/.git/starfix-home' mvn --batch-mode -Dmaven.repo.local=../.git/starfix-m2 -Dvariant.native.version=0.9.3 -pl hybridse-proto,hybridse-sdk,openmldb-common,openmldb-jdbc,openmldb-spark-connector,openmldb-batch test-compile)",
  "(cd java && MAVEN_OPTS='-Djansi.tmpdir=/workspace/.git/jansi -Duser.home=/workspace/.git/starfix-home' mvn --batch-mode -Dmaven.repo.local=../.git/starfix-m2 -Dvariant.native.version=0.9.3 -Dgpg.skip=true -Dmaven.source.skip=true -Dmaven.javadoc.skip=true -Dscalatest.skip=true -Dmaven.test.skip=true -N install)",
  "(cd java && MAVEN_OPTS='-Djansi.tmpdir=/workspace/.git/jansi -Duser.home=/workspace/.git/starfix-home' mvn --batch-mode -Dmaven.repo.local=../.git/starfix-m2 -Dvariant.native.version=0.9.3 -Dgpg.skip=true -Dmaven.source.skip=true -Dmaven.javadoc.skip=true -Dscalatest.skip=true -Dmaven.test.skip=true -pl hybridse-proto,hybridse-sdk,openmldb-common,openmldb-jdbc,openmldb-spark-connector install)",
  "MAVEN_OPTS='-Djansi.tmpdir=/workspace/.git/jansi -Duser.home=/workspace/.git/starfix-home' mvn --offline --batch-mode -Dmaven.repo.local=.git/starfix-m2 org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile=.git/starfix-m2/com/4paradigm/openmldb/hybridse-native/0.9.3/hybridse-native-0.9.3.jar -DgroupId=com.4paradigm.openmldb -DartifactId=hybridse-native -Dversion=0.9.3-SNAPSHOT -Dpackaging=jar -DgeneratePom=true",
  "MAVEN_OPTS='-Djansi.tmpdir=/workspace/.git/jansi -Duser.home=/workspace/.git/starfix-home' mvn --offline --batch-mode -Dmaven.repo.local=.git/starfix-m2 org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile=.git/starfix-m2/com/4paradigm/openmldb/openmldb-native/0.9.3/openmldb-native-0.9.3.jar -DgroupId=com.4paradigm.openmldb -DartifactId=openmldb-native -Dversion=0.9.3-SNAPSHOT -Dpackaging=jar -DgeneratePom=true",
]
verification_prefixes = [
  "cd java && MAVEN_OPTS='-Djansi.tmpdir=/workspace/.git/jansi -Duser.home=/workspace/.git/starfix-home' mvn --offline --batch-mode ",
  "cd java && SPARK_LOCAL_IP=127.0.0.1 SPARK_LOCAL_HOSTNAME=localhost SPARK_USER=starfix MAVEN_OPTS='-Djansi.tmpdir=/workspace/.git/jansi -Duser.home=/workspace/.git/starfix-home' mvn --offline --batch-mode ",
  "cd java && SPARK_LOCAL_IP=127.0.0.1 SPARK_LOCAL_HOSTNAME=localhost SPARK_USER=starfix JAVA_TOOL_OPTIONS=-Djava.io.tmpdir=/workspace/.git/starfix-native-tmp MAVEN_OPTS='-Djansi.tmpdir=/workspace/.git/jansi -Duser.home=/workspace/.git/starfix-home' mvn --offline --batch-mode ",
]
required_verification_markers = ["test-compile", "TestOpenmldbBatchConfig", "TestSparkPlanner"]
branch_template = "{login}/{scope}/{slug}"
default_scope = "batch"
max_files_changed = 6
max_diff_lines = 180
