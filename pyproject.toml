[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reposteward"
dynamic = ["version"]
description = "Local-first, policy-gated control plane for turning GitHub issues into verified, human-reviewed pull requests with coding agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "tiammomo", email = "tiammomo@users.noreply.github.com" }]
dependencies = [
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/tiammomo/RepoSteward"
Repository = "https://github.com/tiammomo/RepoSteward.git"
Issues = "https://github.com/tiammomo/RepoSteward/issues"

[project.optional-dependencies]
web = ["fastapi>=0.141.1,<0.142", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]
a2a = ["a2a-sdk==1.1.0", "fastapi>=0.141.1,<0.142", "uvicorn>=0.34,<1"]
codex-sdk = ["openai-codex>=0.147,<0.148"]
mcp = [
    "mcp>=2.1.1,<3",
]

[dependency-groups]
dev = [
  "mcp>=2.1.1,<3", "httpx>=0.28,<1", "a2a-sdk==1.1.0", "hatchling", "editables>=0.3",
  "fastapi>=0.141.1,<0.142", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
]

[project.scripts]
reposteward = "reposteward.cli:main"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "hatch_build.py" },
  { file = "scripts/build_frontend.py" },
  { env = "REPOSTEWARD_BUILD_WEB" },
  { file = "frontend/package*.json" },
  { file = "frontend/*.ts" },
  { file = "frontend/*.mjs" },
  { file = "frontend/index.html" },
  { file = "frontend/src/**" },
  { file = "src/reposteward/web/api/*.py" },
]

[tool.hatch.build]
exclude = ["/.git", "/.starfix", "/.reposteward", "/.venv", "/dist", "/notes", "/frontend/dist", "/frontend/node_modules"]
skip-excluded-dirs = true

[tool.hatch.version]
path = "src/reposteward/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reposteward"]

[tool.hatch.build.targets.wheel.force-include]
"docker/Dockerfile.runner" = "reposteward/data/Dockerfile.runner"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/docker/Dockerfile.runner",
  "/docs",
  "/tests",
  "/examples",
  "/README.md",
  "/README.zh-CN.md",
  "/CHANGELOG.md",
  "/scripts/check_release.py",
  "/scripts/build_frontend.py",
  "/LICENSE",
  "/reposteward.example.toml",
  "/pyproject.toml",
  "/uv.lock",
  "/frontend",
  "/hatch_build.py",
]
