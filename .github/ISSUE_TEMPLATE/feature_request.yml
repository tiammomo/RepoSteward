name: 功能建议
description: 提议一个有明确用户价值的 RepoSteward 能力
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 用户问题
      description: 描述当前用户需要重复完成或无法安全完成的工作，不要只描述实现方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明产品行为、边界以及它属于 Pipeline、Harness、Runner 还是 GitHub 集成。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明目前如何绕过，以及为什么仍值得在 RepoSteward 中实现。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      placeholder: |
        - [ ] ……
        - [ ] ……
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: 安全与兼容性影响
      description: 是否影响凭据、公开写入、协议、数据库迁移、Harness 或验证隔离？
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索已有 Issue、PR 和路线图。
          required: true
        - label: 该建议符合本地优先、策略门禁和人工确认的产品边界。
          required: true
