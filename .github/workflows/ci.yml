name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --locked --python 3.12

      - name: Lint
        run: uvx ruff check .

      - name: Check formatting
        run: uvx ruff format --check .

      - name: Test
        run: uv run --python 3.12 python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Run deterministic benchmarks
        id: benchmark
        run: uv run --locked --offline --python 3.12 reposteward benchmark run --output benchmark-report.json

      - name: Archive benchmark report
        if: ${{ !cancelled() && (steps.benchmark.outcome == 'success' || steps.benchmark.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reposteward-bench-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: benchmark-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Build distributions
        run: uv build
